<script>

window.addEventListener('load',()=>setTimeout(()=>{
const selectors=['.match-dialog__panel','.match-card-detail>img','.match-card-detail__action-panel','.match-dialog__close'];
const rects=selectors.map(selector=>{const r=document.querySelector(selector).getBoundingClientRect();return {selector,top:r.top,bottom:r.bottom,left:r.left,right:r.right};});

const result=document.createElement('pre');result.id='qa-result';result.textContent=JSON.stringify({pass,width:innerWidth,height:innerHeight,rects,descriptionScroll:desc.scrollHeight>desc.clientHeight,actionScroll:action.scrollHeight>action.clientHeight});document.body.append(result);

</script>
